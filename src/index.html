<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PrintOps</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Scripts only from same origin (blocks injected/remote script XSS); inline styles allowed for Angular's
       component style tags and Tailwind's dynamic classes; no plugins/objects; images/logo snapshots and the
       PDF canvas export can be data:/blob: URIs; worker-src covers the STL volume Web Worker. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; worker-src 'self' blob:;">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
